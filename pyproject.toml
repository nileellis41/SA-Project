[project]
name = "amp-sa"
version = "0.1.0"
description = "Systematic cross-asset relative value book"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "statsmodels>=0.14",
    "cvxpy>=1.5",
    "yfinance>=1.7.0",
    "hmmlearn>=0.3.3",
    "scikit-learn>=1.9.1",
    "matplotlib>=3.11.2",
    "tabulate>=0.10.0",
]

[project.optional-dependencies]
mt5 = [
    "metatrader5>=5.0.6231",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amp_sa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
